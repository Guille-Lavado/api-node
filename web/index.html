<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probar API Rest</title>
    <script type="module">
        fetch('http://localhost:1234/poems')
            .then(res => res.json())
            .then(poems => {
                const html = poems.map(poem => {
                    return `
                        <article data-id="${poem.id}">
                            <h2>${poem.writer}</h2>
                            <p>${poem.poem.replaceAll('\n', '</br>')}</p>
                            <small>-- ${poem.year_publication} --</small>
                            <button class="deleteBtn">Eliminar</button>
                        </article>
                    `;
                }).join('');

                document.querySelector('main').innerHTML = html;

                document.addEventListener('click', e => {
                    if (!e.target.matches('.deleteBtn')) return
                    
                    const article = e.target.closest('article');
                    const id = article.dataset.id;

                    fetch(`http://localhost:1234/poems/${id}`, {
                        method: 'DELETE'
                    })
                        .then(res => { if (res.ok) article.remove() });
                });
            });
    </script>
</head>
<body>
    <main></main>
</body>
</html>
